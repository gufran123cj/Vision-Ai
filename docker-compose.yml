version: "3.8"

services:
  vision-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision-ai-training

    # ✅ GPU için doğru Compose sözdizimi
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all         # 1 yazarsan tek GPU ayırır
              capabilities: [gpu]

    # Windows'ta webcam bağlama çalışmaz, Linux'taysan aç:
    # devices:
    #   - /dev/video0:/dev/video0

    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
      - ./runs:/app/runs
      - ./week1:/app/week1
      - ./week2:/app/week2
      - ./week3:/app/week3
      - ./week4:/app/week4

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    stdin_open: true
    tty: true
