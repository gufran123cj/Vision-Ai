version: "3.8"

services:
  vision-ai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vision-ai-training

    # GPU tahsisi (Compose için doğru yöntem)
    device_requests:
      - driver: nvidia
        count: all
        capabilities: ["gpu"]

    # Windows/WSL2'de webcam bağlama çalışmaz; Linux'taysan aç:
    # devices:
    #   - /dev/video0:/dev/video0

    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
      - ./runs:/app/runs
      - ./week1:/app/week1
      - ./week2:/app/week2
      - ./week3:/app/week3
      - ./week4:/app/week4

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - NVIDIA_VISIBLE_DEVICES=all
      # Çakışma ihtimali varsa bunu kaldır: CUDA_VISIBLE_DEVICES
      # - CUDA_VISIBLE_DEVICES=0

    restart: unless-stopped
    stdin_open: true
    tty: true
    # Örnek komut (istiyorsan aç):
    # command: python week4/YOLO-Safety-Equipment-Detection-main/train_model.py
